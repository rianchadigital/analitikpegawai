<svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Hexagon Border -->
  <polygon points="100,6 186,54 186,186 100,234 14,186 14,54" stroke="#046A28" stroke-width="12" fill="#ffffff" stroke-linejoin="round"/>
  
  <!-- Green Greek Cross -->
  <g fill="#046A28">
    <!-- Vertical bar -->
    <rect x="74" y="44" width="52" height="152" rx="3"/>
    <!-- Horizontal bar -->
    <rect x="24" y="94" width="152" height="52" rx="3"/>
  </g>
  
  <!-- House Outline (Roof & Structure) on lower-right quadrant of cross -->
  <!-- White outline separator separating top-left cross from house roof -->
  <path d="M60 148 L126 82 L192 148" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- House Roof in dark forest green -->
  <polygon points="68,144 126,86 184,144 184,148 68,148" fill="#035420"/>
  
  <!-- Interlocking White Circles in House Roof (UKM & UKP / Pelayanan Keluarga & Masyarakat) -->
  <circle cx="114" cy="130" r="14" stroke="#ffffff" stroke-width="4.5" fill="none"/>
  <circle cx="134" cy="130" r="14" stroke="#ffffff" stroke-width="4.5" fill="none"/>
</svg>
