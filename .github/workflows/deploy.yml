name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Web
        run: npm run build

      - name: Deploy Compiled Files to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: production
          clean: true
          commit-message: "deploy: automated build for Hostinger [skip ci]"
